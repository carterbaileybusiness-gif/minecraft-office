plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Loom adds the essential Minecraft/Fabric maven repositories automatically.
}

// Single Gradle build at the repo root; all mod sources live under mod/.
sourceSets {
	main {
		java.srcDirs = ['mod/src/main/java']
		resources.srcDirs = ['mod/src/main/resources']
	}
	test {
		java.srcDirs = ['mod/src/test/java']
		resources.srcDirs = ['mod/src/test/resources']
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"office" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Fabric GameTest (server) + client GameTest in a dedicated `gametest` source set.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "office-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true // By setting this to true, you agree to the Minecraft EULA.
	}
}

// Client sources split into their own source set by Loom; relocate it and the gametest set.
sourceSets {
	client {
		java.srcDirs = ['mod/src/client/java']
		resources.srcDirs = ['mod/src/client/resources']
	}
	gametest {
		java.srcDirs = ['mod/src/gametest/java']
		resources.srcDirs = ['mod/src/gametest/resources']
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests (JUnit 5 + Fabric Loader JUnit so Minecraft classes are usable).
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Let unit tests see client classes (later tasks test client code from mod/src/test).
	testImplementation sourceSets.client.output
	testRuntimeOnly sourceSets.client.output
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// Loom registers runGameTest / runClientGameTest; expose the spellings used by CI and docs too.
tasks.register('runGametest') {
	group = 'verification'
	description = 'Alias for runGameTest (server game tests).'
	dependsOn 'runGameTest'
}
tasks.register('runClientGametest') {
	group = 'verification'
	description = 'Alias for runClientGameTest (client game tests; needs a display, use xvfb-run on Linux).'
	dependsOn 'runClientGameTest'
}
