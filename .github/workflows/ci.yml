name: ci
on: [pull_request, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew
      - name: build, unit tests, server gametests
        run: ./gradlew build test runGametest
      - name: install xvfb (Linux client gametest)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: client gametests (Linux only, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run ./gradlew runClientGametest
      - name: store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
      - name: capture build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
  # The macOS `helper` job (swift build && swift test in helper-mac/) is added in Task 8.
