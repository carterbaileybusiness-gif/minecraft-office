name: ci
on: [pull_request, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew
      - name: build, unit tests, server gametests
        run: ./gradlew build test runGametest
      - name: install xvfb (Linux client gametest)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: client gametests (Linux only, virtual display)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: xvfb-run ./gradlew runClientGametest
      - name: store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/gameTest/logs/
          if-no-files-found: ignore
      - name: capture build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
  helper:
    name: mac helper (swift)
    runs-on: macos-15
    env:
      OFFICE_HELPER_NO_SIGN: "1"   # signing only ever happens on Carter's Mac
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: test and build OfficeHelper.app
        run: bash helper-mac/check.sh && bash helper-mac/build.sh
      - name: protocol fixtures are committed and current
        run: git diff --exit-code -- helper-mac/Tests/fixtures
